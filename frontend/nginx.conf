server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React pages: always return index.html (React Router handles the URL)
  location / {
    try_files $uri /index.html;
  }

  # API calls: forward to the container named "backend"
  location /api/ {
    proxy_pass http://backend:5000;
  }
}